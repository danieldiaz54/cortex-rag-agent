[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-rag-agent"
version = "1.0.0"
description = "Multi-Agent Hybrid RAG (BM25 + pgvector/Dense Vector + RRF) with Citation Guardrails and Append-Only Evaluation Ledger"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Daniel" }
]
dependencies = []

[project.optional-dependencies]
asgi = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
]
dev = [
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
