<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex — Chat Inteligente con tus Documentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg-canvas: #f8fafc;
        --bg-paper: #ffffff;
        --bg-soft: #eef2f7;
        --navy-ink: #1e3a5f;
        --navy-hover: #172e4d;
        --body-ink: #1e293b;
        --muted-ink: #475569;
        --border-rule: #cbd5e1;
        --cite-amber: #b45309;
        --cite-bg: #fef3c7;
        --font-serif: "Source Serif 4", Georgia, serif;
        --font-sans: "Atkinson Hyperlegible", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-canvas);
        color: var(--body-ink);
        font-family: var(--font-sans);
        line-height: 1.55;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      ::selection { background: var(--cite-bg); color: var(--navy-ink); }
      :focus-visible { outline: 2px solid var(--navy-ink); outline-offset: 2px; }
      button, input, textarea { font-family: inherit; }

      .cx-header {
        background: var(--bg-paper);
        border-bottom: 1px solid var(--border-rule);
        padding: 12px 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .cx-brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .cx-brand h1 {
        font-family: var(--font-serif);
        font-size: 24px;
        font-weight: 700;
        color: var(--navy-ink);
        margin: 0;
      }
      .cx-brand span {
        font-size: 13.5px;
        color: var(--muted-ink);
      }
      .cx-header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cx-btn-primary {
        border: 1px solid var(--navy-ink);
        background: var(--navy-ink);
        color: #ffffff;
        border-radius: 8px;
        padding: 8px 15px;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .cx-btn-primary:hover:not(:disabled) { background: var(--navy-hover); }
      .cx-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .cx-btn-outline {
        border: 1px solid var(--border-rule);
        background: var(--bg-paper);
        color: var(--body-ink);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .cx-btn-outline:hover { background: var(--bg-soft); }

      /* Split 2-pane Reading & Q&A Studio */
      .cx-workspace {
        flex: 1;
        min-height: 0;
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
        padding: 20px 24px;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 22px;
      }
      .cx-pane {
        background: var(--bg-paper);
        border: 1px solid var(--border-rule);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .cx-pane-head {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-rule);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cx-pane-head h2 {
        font-family: var(--font-serif);
        font-size: 18px;
        color: var(--navy-ink);
        margin: 0;
      }
      .cx-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cx-starters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cx-starter-chip {
        border: 1px solid var(--border-rule);
        background: var(--bg-canvas);
        color: var(--navy-ink);
        border-radius: 8px;
        padding: 6px 11px;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
      }
      .cx-starter-chip:hover { border-color: var(--navy-ink); background: var(--bg-soft); }

      .cx-turn {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cx-user-q {
        align-self: flex-end;
        max-width: 85%;
        background: var(--navy-ink);
        color: #ffffff;
        padding: 10px 14px;
        border-radius: 12px 12px 2px 12px;
        font-size: 14.5px;
      }
      .cx-ai-a {
        background: var(--bg-canvas);
        border: 1px solid var(--border-rule);
        border-radius: 12px;
        padding: 16px 18px;
      }
      .cx-ai-serif {
        font-family: var(--font-serif);
        font-size: 16.5px;
        line-height: 1.65;
        margin: 0;
        color: var(--body-ink);
      }
      .cx-cite-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-rule);
      }
      .cx-cite-btn {
        border: 1px solid #f59e0b;
        background: var(--cite-bg);
        color: var(--cite-amber);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .cx-cite-btn:hover { background: #fde68a; }

      .cx-ask-bar {
        padding: 14px 18px;
        border-top: 1px solid var(--border-rule);
        background: var(--bg-paper);
        display: flex;
        gap: 10px;
      }
      .cx-ask-input {
        flex: 1;
        border: 1px solid var(--border-rule);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14.5px;
      }

      /* Right Source Document Reader */
      .cx-doc-block {
        border: 1px solid var(--border-rule);
        border-radius: 10px;
        padding: 16px 18px;
        background: var(--bg-paper);
        transition: background-color 220ms ease, border-color 220ms ease;
      }
      .cx-doc-block[data-highlighted="true"] {
        background: var(--cite-bg);
        border-color: var(--cite-amber);
      }
      .cx-doc-title {
        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 700;
        color: var(--navy-ink);
        margin: 0 0 4px;
      }
      .cx-doc-meta {
        font-size: 12.5px;
        color: var(--muted-ink);
        margin-bottom: 8px;
      }
      .cx-doc-body {
        font-family: var(--font-serif);
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
        color: var(--body-ink);
      }

      /* Drawers */
      .cx-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.34);
        z-index: 40;
        display: none;
        justify-content: flex-end;
      }
      .cx-backdrop[data-open="true"] { display: flex; }
      .cx-drawer {
        width: min(460px, 100vw);
        height: 100%;
        background: var(--bg-paper);
        border-left: 1px solid var(--border-rule);
        display: flex;
        flex-direction: column;
      }
      .cx-drawer-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-rule);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cx-drawer-head h2 { font-family: var(--font-serif); font-size: 20px; margin: 0; color: var(--navy-ink); }
      .cx-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .cx-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      .cx-tech-card {
        border: 1px solid var(--border-rule);
        background: var(--bg-canvas);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        body { height: auto; }
        .cx-workspace { grid-template-columns: 1fr; }
        .cx-pane { min-height: 440px; }
      }
    </style>
  </head>
  <body>
    <header class="cx-header">
      <div class="cx-brand">
        <h1>Cortex</h1>
        <span>Pregunta a tus documentos con citas verificables</span>
      </div>
      <div class="cx-header-actions">
        <button type="button" class="cx-btn-outline" id="cx-ingest-btn">+ Agregar documento</button>
        <button type="button" class="cx-btn-primary" id="cx-arch-btn">Arquitectura</button>
      </div>
    </header>

    <main class="cx-workspace">
      <section class="cx-pane" aria-label="Conversación sobre documentos">
        <div class="cx-pane-head">
          <h2>Preguntas y respuestas</h2>
          <span style="font-size:12.5px;color:var(--muted-ink);">Haz clic en una cita para saltar al texto</span>
        </div>

        <div class="cx-scroll" id="cx-chat-scroll">
          <div>
            <p style="margin:0 0 8px;font-size:13.5px;color:var(--muted-ink);">Prueba una consulta directa sobre los manuales cargados:</p>
            <div class="cx-starters">
              <button type="button" class="cx-starter-chip" data-q="Como funciona la busqueda hibrida BM25 y pgvector RRF?">¿Cómo funciona la búsqueda híbrida?</button>
              <button type="button" class="cx-starter-chip" data-q="Como se resuelve ERR-409-OPTIMISTIC-LOCK en el libro contable?">¿Cómo se resuelve ERR-409-OPTIMISTIC-LOCK?</button>
              <button type="button" class="cx-starter-chip" data-q="Como verifica las citas y evita alucinaciones?">¿Cómo verifica las citas?</button>
            </div>
          </div>
          <div id="cx-turns-list" style="display:flex;flex-direction:column;gap:18px;"></div>
        </div>

        <form class="cx-ask-bar" id="cx-ask-form">
          <label for="cx-question-input" class="sr-only" style="position:absolute;left:-9999px;">Escribe tu pregunta</label>
          <input id="cx-question-input" class="cx-ask-input" type="text" placeholder="Pregunta sobre cualquier sección o código..." />
          <button type="submit" class="cx-btn-primary" id="cx-send-btn">Preguntar</button>
        </form>
      </section>

      <section class="cx-pane" aria-label="Lector de documentos fuente">
        <div class="cx-pane-head">
          <h2>Documentos fuente</h2>
          <span class="cx-mono" id="cx-chunk-count" style="font-size:12.5px;color:var(--muted-ink);">0 secciones</span>
        </div>
        <div class="cx-scroll" id="cx-docs-scroll"></div>
      </section>
    </main>

    <!-- Ingest Document Drawer -->
    <div class="cx-backdrop" id="cx-ingest-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="cx-drawer">
        <div class="cx-drawer-head">
          <h2>Agregar documento</h2>
          <button type="button" class="cx-btn-outline" id="cx-ingest-close">Cerrar</button>
        </div>
        <div class="cx-drawer-body" id="cx-ingest-body"></div>
      </div>
    </div>

    <!-- Layer 2 Architecture Drawer -->
    <div class="cx-backdrop" id="cx-arch-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="cx-drawer">
        <div class="cx-drawer-head">
          <h2>Pipeline RAG Híbrido &amp; Evals</h2>
          <button type="button" class="cx-btn-outline" id="cx-arch-close">Cerrar</button>
        </div>
        <div class="cx-drawer-body" id="cx-arch-body"></div>
      </div>
    </div>

    <script>
      (function () {
        const state = {
          chunks: [],
          highlightedChunkId: null,
          lastQueryResult: null,
          evalRun: null,
        };

        const els = {
          turns: document.getElementById("cx-turns-list"),
          chatScroll: document.getElementById("cx-chat-scroll"),
          docsScroll: document.getElementById("cx-docs-scroll"),
          chunkCount: document.getElementById("cx-chunk-count"),
          askForm: document.getElementById("cx-ask-form"),
          askInput: document.getElementById("cx-question-input"),
          sendBtn: document.getElementById("cx-send-btn"),
          ingestBackdrop: document.getElementById("cx-ingest-backdrop"),
          ingestBody: document.getElementById("cx-ingest-body"),
          archBackdrop: document.getElementById("cx-arch-backdrop"),
          archBody: document.getElementById("cx-arch-body"),
        };

        function el(tag, props, children) {
          const node = document.createElement(tag);
          if (props) {
            for (const [k, v] of Object.entries(props)) {
              if (k === "className") node.className = v;
              else if (k === "textContent") node.textContent = v;
              else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
              else node.setAttribute(k, String(v));
            }
          }
          if (Array.isArray(children)) {
            for (const c of children) {
              if (typeof c === "string") node.appendChild(document.createTextNode(c));
              else if (c) node.appendChild(c);
            }
          }
          return node;
        }

        async function loadChunks() {
          const resp = await fetch("/api/v1/chunks");
          const data = await resp.json();
          state.chunks = data.chunks || [];
          els.chunkCount.textContent = state.chunks.length + " secciones";
          renderDocs();
        }

        function focusChunk(chunkId) {
          state.highlightedChunkId = chunkId;
          renderDocs();
          const target = document.getElementById("doc-chunk-" + chunkId);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }

        function renderDocs() {
          const blocks = state.chunks.map(function (c) {
            return el("article", {
              id: "doc-chunk-" + c.chunk_id,
              className: "cx-doc-block",
              "data-highlighted": state.highlightedChunkId === c.chunk_id ? "true" : "false",
            }, [
              el("h3", { className: "cx-doc-title", textContent: c.title }),
              el("div", { className: "cx-doc-meta", textContent: c.doc_id + " · " + c.section }),
              el("p", { className: "cx-doc-body", textContent: c.content }),
            ]);
          });
          els.docsScroll.replaceChildren.apply(els.docsScroll, blocks);
        }

        async function askQuestion(queryText) {
          const clean = queryText.trim();
          if (!clean) return;
          els.sendBtn.disabled = true;
          els.askInput.value = "";

          try {
            const resp = await fetch("/api/v1/rag/query", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: clean, top_k: 4 }),
            });
            const res = await resp.json();
            if (!resp.ok) {
              els.turns.appendChild(
                el("div", { className: "cx-ai-a", textContent: res.message || "No se encontró respaldo documental para esa consulta." }),
              );
              return;
            }
            state.lastQueryResult = res;
            const citations = res.citations || [];
            const citeButtons = citations.map(function (c, idx) {
              return el("button", {
                type: "button",
                className: "cx-cite-btn",
                textContent: "[" + (idx + 1) + "] " + c.title,
                onClick: function () { focusChunk(c.chunk_id); },
              });
            });

            if (citations[0]) {
              focusChunk(citations[0].chunk_id);
            }

            const cleanedAnswer = String(res.answer || "").replace(/\s*\[cite:[^\]]+\]/g, "");
            els.turns.appendChild(
              el("div", { className: "cx-turn" }, [
                el("div", { className: "cx-user-q", textContent: clean }),
                el("div", { className: "cx-ai-a" }, [
                  el("p", { className: "cx-ai-serif", textContent: cleanedAnswer }),
                  el("div", { className: "cx-cite-row" }, citeButtons),
                ]),
              ]),
            );
            els.chatScroll.scrollTop = els.chatScroll.scrollHeight;
            renderArchitectureDrawer();
          } finally {
            els.sendBtn.disabled = false;
          }
        }

        function openIngestDrawer() {
          const titleIn = el("input", { className: "cx-ask-input", placeholder: "Ej. Política de Devoluciones 2026" });
          const sectionIn = el("input", { className: "cx-ask-input", value: "operaciones" });
          const contentIn = el("textarea", {
            className: "cx-ask-input",
            style: "min-height:130px;",
            placeholder: "Pega aquí un párrafo o guía para consultarla en el chat...",
          });
          const saveBtn = el("button", {
            type: "button",
            className: "cx-btn-primary",
            textContent: "Indexar documento",
            onClick: async function () {
              const resp = await fetch("/api/v1/documents/ingest", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  doc_id: "DOC-USER-" + Math.random().toString(36).slice(2, 6).toUpperCase(),
                  title: titleIn.value.trim() || "Documento de usuario",
                  section: sectionIn.value.trim() || "general",
                  content: contentIn.value.trim(),
                  tags: ["usuario"],
                }),
              });
              if (resp.ok) {
                els.ingestBackdrop.setAttribute("data-open", "false");
                await loadChunks();
              }
            },
          });

          els.ingestBody.replaceChildren(
            el("label", { style: "font-size:13px;font-weight:700;", textContent: "Título" }),
            titleIn,
            el("label", { style: "font-size:13px;font-weight:700;", textContent: "Sección" }),
            sectionIn,
            el("label", { style: "font-size:13px;font-weight:700;", textContent: "Contenido" }),
            contentIn,
            saveBtn,
          );
          els.ingestBackdrop.setAttribute("data-open", "true");
        }

        async function runEvalSuite() {
          const resp = await fetch("/api/v1/evals/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          state.evalRun = await resp.json();
          renderArchitectureDrawer();
        }

        function renderArchitectureDrawer() {
          const nodes = [
            el("div", { className: "cx-tech-card" }, [
              el("strong", { style: "display:block;margin-bottom:4px;", textContent: "Pipeline Multi-Agente + RAG Híbrido (Okapi BM25 + Vectores 64-D RRF)" }),
              el("span", { style: "color:var(--muted-ink);", textContent: "Router clasifica intención léxica vs semántica; RRF k=60 fusiona candidatos y Citation Guardrail bloquea respuestas sin evidencia." }),
            ]),
          ];

          if (state.lastQueryResult) {
            nodes.push(
              el("div", { className: "cx-tech-card" }, [
                el("strong", { style: "display:block;margin-bottom:4px;", textContent: "Última consulta auditada" }),
                el("div", { className: "cx-mono", textContent: "Intención: " + state.lastQueryResult.intent + " · Faithfulness: " + state.lastQueryResult.faithfulness_score + " · Latencia: " + Number(state.lastQueryResult.total_latency_ms).toFixed(2) + " ms" }),
              ]),
            );
          }

          if (state.evalRun) {
            nodes.push(
              el("div", { className: "cx-tech-card", style: "background:var(--cite-bg);border-color:var(--cite-amber);" }, [
                el("strong", { style: "display:block;margin-bottom:4px;", textContent: "Eval Harness (" + state.evalRun.run_id + ")" }),
                el("span", { className: "cx-mono", textContent: state.evalRun.passed_cases + "/" + state.evalRun.total_cases + " casos PASS · Faithfulness " + state.evalRun.avg_faithfulness + " · Gate: " + (state.evalRun.passed_gate ? "APROBADO" : "REVISAR") }),
              ]),
            );
          }

          nodes.push(
            el("button", {
              type: "button",
              className: "cx-btn-primary",
              textContent: "Ejecutar suite de evaluación (Eval Harness)",
              onClick: runEvalSuite,
            }),
          );

          els.archBody.replaceChildren.apply(els.archBody, nodes);
        }

        document.querySelectorAll(".cx-starter-chip").forEach(function (btn) {
          btn.addEventListener("click", function () { askQuestion(btn.getAttribute("data-q") || ""); });
        });
        els.askForm.addEventListener("submit", function (e) {
          e.preventDefault();
          askQuestion(els.askInput.value);
        });
        document.getElementById("cx-ingest-btn").addEventListener("click", openIngestDrawer);
        document.getElementById("cx-ingest-close").addEventListener("click", function () { els.ingestBackdrop.setAttribute("data-open", "false"); });
        document.getElementById("cx-arch-btn").addEventListener("click", function () { renderArchitectureDrawer(); els.archBackdrop.setAttribute("data-open", "true"); });
        document.getElementById("cx-arch-close").addEventListener("click", function () { els.archBackdrop.setAttribute("data-open", "false"); });
        window.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            els.ingestBackdrop.setAttribute("data-open", "false");
            els.archBackdrop.setAttribute("data-open", "false");
          }
        });

        loadChunks().then(function () {
          askQuestion("Como funciona la busqueda hibrida BM25 y pgvector RRF?");
        });
      })();
    </script>
  </body>
</html>
